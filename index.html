<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Patio · Mi tarjeta</title><style>
:root{--green:#497f5b;--dark:#193f2b;--cream:#f8f5ec;--line:#d9e3d8}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--dark);font-family:system-ui,-apple-system,Arial,sans-serif}header{background:var(--green);color:white;padding:22px 18px;text-align:center}header .logo{display:block;width:min(300px,80vw);height:auto;margin:0 auto}header small{display:block;letter-spacing:2px}main{max-width:520px;margin:auto;padding:18px}nav{display:flex;gap:8px;margin:0 0 20px}nav button{flex:1;background:white;color:var(--dark);border:1px solid var(--line);font-size:13px}nav button.active{background:var(--dark);color:white}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 4px 18px #193f2b0b}h1,h2{margin:0 0 10px}h1{font-size:24px}h2{font-size:19px}p{line-height:1.5}label{font-size:13px;font-weight:700;display:block;margin:12px 0 5px}input{width:100%;padding:13px;border:1px solid #a7baa9;border-radius:10px;font-size:16px}button{padding:12px 15px;border:0;border-radius:10px;background:var(--green);color:white;font-weight:700;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#e7eee7;color:var(--dark)}.muted{color:#667a6c;font-size:13px}.count{font-size:46px;font-weight:800;margin:8px 0}.track{height:15px;background:#e4ebe4;border-radius:20px;overflow:hidden}.fill{height:100%;background:var(--green);transition:width .2s}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:16px 0}.stamp{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;border:2px dashed #a8bba9;color:#7c9b83;font-size:22px}.stamp.done{background:var(--green);border:0;color:white}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.pill{border-radius:30px;background:#e9f1e8;padding:6px 12px;font-size:12px;font-weight:700}.notice{padding:12px;background:#f1f5e9;border-radius:10px;font-size:13px}.hidden{display:none}footer{text-align:center;padding:18px;color:#647b69;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1}.error{color:#a12b20}.success{color:#287445}#qr{display:block;margin:14px auto;width:160px;height:160px;border:10px solid white;outline:1px solid var(--line)}
</style></head><body><header><img class="logo" src="logo-patio.png" alt="Patio"><div style="font-size:13px;margin-top:8px">El lado más fresco del golf ⛳</div></header><main><div class="notice"><strong>DEMO INTERACTIVA.</strong> Los datos se guardan únicamente en este navegador. No usar con clientes reales hasta conectar una base de datos y autenticar al personal.</div><nav style="margin-top:16px"><button id="tab-player" onclick="tab('player')" class="active">Mi tarjeta</button><button id="tab-ranking" onclick="tab('ranking')">Ranking</button><button id="tab-staff" onclick="tab('staff')">Personal</button></nav><section id="player"></section><section id="ranking" class="hidden"></section><section id="staff" class="hidden"></section></main><footer>Patio del Caddie · Prototipo de fidelización</footer><script>
const KEY='patio-caddie-demo-v1';const month=()=>new Date().toISOString().slice(0,7);const today=()=>{let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};let db;try{db=JSON.parse(localStorage.getItem(KEY))||{players:[],current:null,history:[]}}catch{db={players:[],current:null,history:[]}};function save(){localStorage.setItem(KEY,JSON.stringify(db));render()};function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))};function active(){return db.players.find(p=>p.id===db.current)};function visits(p){return db.history.filter(h=>h.player===p.id&&h.type==='visit'&&h.date.startsWith(month())).length};function tab(t){for(let n of ['player','ranking','staff']){document.getElementById(n).classList.toggle('hidden',n!==t);document.getElementById('tab-'+n).classList.toggle('active',n===t)}render()};function register(){let name=document.getElementById('name').value.trim();if(name.length<2||name.length>24){alert('Ingresá un apodo de 2 a 24 caracteres');return}let p={id:crypto.randomUUID(),name,progress:0,rewards:0,lastVisit:''};db.players.push(p);db.current=p.id;save()};function selectPlayer(id){db.current=id;save();tab('player')};function visit(id){let p=db.players.find(x=>x.id===id);if(!p)return;if(p.lastVisit===today()){alert('Ya tiene una visita registrada hoy.');return}p.lastVisit=today();p.progress+=1;db.history.push({player:id,type:'visit',date:today(),at:new Date().toISOString()});save()};function redeem(id){let p=db.players.find(x=>x.id===id);if(!p||p.progress<10)return;p.progress-=10;p.rewards+=1;db.history.push({player:id,type:'redeem',date:today(),at:new Date().toISOString()});save()};function render(){let p=active();document.getElementById('player').innerHTML=p?`<div class="card"><div class="row"><div><span class="muted">MI TARJETA</span><h1>${esc(p.name)}</h1></div><span class="pill">Socio del Patio</span></div><div class="count">${p.progress} <span class="muted">/ 10 visitas</span></div><div class="track"><div class="fill" style="width:${Math.min(100,p.progress*10)}%"></div></div><div class="grid">${Array.from({length:10},(_,i)=>`<div class="stamp ${i<p.progress?'done':''}">${i<p.progress?'✓':'☕'}</div>`).join('')}</div><p>${p.progress>=10?'🎉 ¡Tenés un café gratis listo para canjear!':`Te faltan <strong>${10-p.progress}</strong> visitas con compra para tu café gratis.`}</p><div class="notice">Mostrá tu tarjeta al pagar. El personal registra una visita por día.</div><p class="muted">Visitas este mes: ${visits(p)} · Cafés canjeados: ${p.rewards}</p></div><div class="card"><h2>Cambiar de jugador (demo)</h2><div class="actions"><button class="secondary" onclick="db.current=null;save()">Registrar otro apodo</button></div></div>`:`<div class="card"><h1>Bienvenido a Patio</h1><p>Venís, consumís, sumás visitas y ganás cafés. Cada 10 visitas con compra, un café gratis.</p><label for="name">Elegí tu apodo</label><input id="name" maxlength="24" placeholder="Ej. Tiger de Barrio"><p><button onclick="register()">Crear mi tarjeta</button></p><p class="muted">Esta versión es una demostración local.</p></div>`;
let rank=[...db.players].sort((a,b)=>visits(b)-visits(a));document.getElementById('ranking').innerHTML=`<div class="card"><h1>🏆 Ranking de ${new Date().toLocaleString('es-AR',{month:'long'})}</h1><p class="muted">Cuenta una visita con compra por día. El ranking se reinicia cada mes, pero el progreso hacia el café no.</p>${rank.length?rank.map((p,i)=>`<div class="row"><span>${['🥇','🥈','🥉'][i]||i+1+'.'} ${esc(p.name)}</span><strong>${visits(p)} visitas</strong></div>`).join(''):'<p>Todavía no hay jugadores.</p>'}</div>`;
document.getElementById('staff').innerHTML=`<div class="card"><h1>Panel del personal</h1><p class="error"><strong>Solo demostración:</strong> este panel no tiene autenticación. En la versión real estará protegido.</p><p class="muted">Confirmá que el cliente pagó antes de sumar una visita. Solo suma quien paga.</p>${db.players.length?db.players.map(p=>`<div class="row"><div><strong>${esc(p.name)}</strong><div class="muted">${p.progress}/10 · ${p.lastVisit===today()?'Ya sumó hoy':'Pendiente hoy'}</div></div><div class="actions"><button ${p.lastVisit===today()?'disabled':''} onclick="visit('${p.id}')">+ Visita</button>${p.progress>=10?`<button class="secondary" onclick="redeem('${p.id}')">Canjear ☕</button>`:''}</div></div>`).join(''):'<p>Primero registrá un jugador.</p>'}</div><div class="card"><button class="secondary" onclick="if(confirm('¿Borrar todos los datos de esta demo?')){localStorage.removeItem(KEY);location.reload()}">Reiniciar demo</button></div>`}
render();</script></body></html>
